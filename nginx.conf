# Template: the official nginx image fills ${NGINX_...} variables from the container environment at start
# (see Dockerfile.frontend); all other $variables below are nginx's own and are left untouched.
server {
    listen 80;
    server_name _;

    # Largest request body (cloud saves, /batch). Set NGINX_MAX_BODY_SIZE to change it.
    client_max_body_size ${NGINX_MAX_BODY_SIZE};

    server_tokens off;

    # The blocks below inherit these only while none of them has its own add_header.
    # style-src needs 'unsafe-inline': ReactFlow and the app set inline styles. img-src also stops style values loading
    # from other hosts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static Web UI frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # REST API proxying to FastAPI backend container
    location /api/ {
        proxy_pass http://walflow-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Realtime Simulation proxying
    location /ws/ {
        proxy_pass http://walflow-backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
