[pytest]
testpaths = tests
pythonpath = . tests/helpers
addopts = --strict-markers
markers =
    unit: single component / function against an analytic reference
    scenario: multi-component network solved end to end
    regression: golden examples and fixed-bug guards
    api: HTTP / WebSocket / database behaviour
    property: hypothesis property test (set automatically)
    slow: noticeably slow (> ~2 s)
    bench: performance benchmarks, not part of the correctness gate
    audit(id): ties a test to an audit / review finding, e.g. audit("F1-24")
# F0-07: Pydantic v2 deprecations are errors, so nothing that breaks on Pydantic v3 slips back in
filterwarnings =
    error::pydantic.warnings.PydanticDeprecatedSince20
    error:'HTTP_413_REQUEST_ENTITY_TOO_LARGE' is deprecated:DeprecationWarning
