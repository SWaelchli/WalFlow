services:
  ############################
  # WalFlow - Backend Engine
  ############################
  walflow-backend:
    image: ghcr.io/swaelchli/walflow-backend:latest
    container_name: walflow-backend
    restart: unless-stopped
    ports:
      - "5701:8000" # Host port 5701 -> Container port 8000
    volumes:
      - /docker/walflow/data:/app/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DATABASE_PATH=/app/data/walflow.db
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - PYTHONUNBUFFERED=1

  ############################
  # WalFlow - Frontend & Nginx Proxy
  ############################
  walflow-frontend:
    image: ghcr.io/swaelchli/walflow-frontend:latest
    container_name: walflow-frontend
    restart: unless-stopped
    ports:
      - "5702:80" # Host port 5702 -> Container port 80
    depends_on:
      - walflow-backend
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
